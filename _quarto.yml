project:
  type: book
  output-dir: _output
  post-render:
    - "bash scripts/post-render.sh"

filters:
  - filters/include-code.lua

book:
  title: "Learning Tactus"
  subtitle: "Give AI agents powerful tools. Safely and securely."
  author: "Ryan Porter"
  date: today
  chapters:
    - index.qmd
    - chapters/00-preface.qmd
    - chapters/00-introduction.qmd
    - part: "Part I: Foundations"
      chapters:
        - chapters/01-what-is-tactus.qmd
        - chapters/02-transparent-durability.qmd
        - chapters/03-everything-as-code.qmd
        - chapters/04-installation.qmd
    - part: "Part II: Build a Useful Agent"
      chapters:
        - chapters/06-your-first-agent.qmd
        - chapters/05-procedures-and-outputs.qmd
        - chapters/07-tools.qmd
        - chapters/08-state-management.qmd
        - chapters/09-the-agent-loop.qmd
        - chapters/10-human-in-the-loop.qmd
    - part: "Part III: Guardrails (Safety + InfoSec)"
      chapters:
        - chapters/11-levers-of-control.qmd
        - chapters/12-threat-modeling-and-guardrails.qmd
        - chapters/13-sandboxing-layers-lua-vm-and-containers.qmd
        - chapters/14-secretless-execution.qmd
    - part: "Part IV: Reliability and Correctness at Scale"
      chapters:
        - chapters/15-behavior-specifications.qmd
        - chapters/16-built-in-steps.qmd
        - chapters/17-evaluations.qmd
    - part: "Part V: Putting It Together"
      chapters:
        - chapters/18-example-research-assistant.qmd
        - chapters/19-example-document-processor.qmd
        - chapters/20-where-to-go.qmd

format:
  html:
    theme:
      light: flatly
      dark: darkly
    code-copy: true
    code-overflow: wrap
    css: simple-style.css
  pdf:
    documentclass: scrbook
    papersize: letter
    fontsize: 11pt
    include-in-header:
      text: |
        \usepackage{fvextra}
        \DefineVerbatimEnvironment{Highlighting}{Verbatim}{breaklines,commandchars=\\\{\}}
        \usepackage{graphicx}
        \usepackage{libertinus}
        \usepackage{tikz}
        \usepackage{xcolor}
        \definecolor{magenta}{RGB}{199,0,126}
        \renewcommand{\maketitle}{}
    include-before-body:
      file: title-page.tex

# Code highlighting for Lua/Tactus
highlight-style: monochrome
